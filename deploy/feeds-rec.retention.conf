# NOT INSTALLED. Drop-in for feeds-rec.service: 30-day retention, Coinbase and Deribit off (their research is closed,
# Dublin 11-24 report D4). Runs the patched feeds_rec.py from the research/hourly-rec worktree, so ~/dublin-retest/repo
# (which rd3-eval runs from) is not touched.
# Install: sudo mkdir -p /etc/systemd/system/feeds-rec.service.d
#          sudo cp deploy/feeds-rec.retention.conf /etc/systemd/system/feeds-rec.service.d/10-retention.conf
#          sudo systemctl daemon-reload && sudo systemctl enable --now feeds-rec     (or: restart, if already running)
# Check:   systemctl cat feeds-rec ; tail ~/dublin-retest/out/feeds_rec.log   (first line after start: "start {... keep_days: 30 ...}")
# Undo:    sudo rm /etc/systemd/system/feeds-rec.service.d/10-retention.conf && sudo systemctl daemon-reload && sudo systemctl restart feeds-rec
# After the 0xc387c2a4 watch ends (12-07), add --no-pmbook to drop the 5-level book (~1 GB/day).
[Service]
WorkingDirectory=/home/ubuntu/dublin-retest/hourly-rec
ExecStart=
ExecStart=/home/ubuntu/shadow-venv/bin/python /home/ubuntu/dublin-retest/hourly-rec/feeds_rec.py --out /home/ubuntu/feeds-rec --keep-days 30 --no-coinbase --no-deribit
